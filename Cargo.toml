[package]
name = "vk-sync-fork"
version = "0.5.2"
license = "MIT/Apache-2.0"
authors = ["Ashley Ruglys <ashley.ruglys@gmail.com>"]
homepage = "https://github.com/expenses/vk-sync-rs"
repository = "https://github.com/expenses/vk-sync-rs"
documentation = "https://docs.rs/vk-sync-fork"
description = "Simplification of core Vulkan synchronization mechanisms such as pipeline barriers and events. Forked off of the original vk-sync crate which is currently unmaintained."
categories = [
    "api-bindings",
    "rendering",
    "rendering::engine",
    "rendering::graphics-api",
]
keywords = ["vulkan", "vk", "ash", "graphics"]
readme = "README.md"
exclude = [".travis.yml", ".gitignore", "appveyor.yml"]
edition = "2024"

[badges]
maintenance = { status = "actively-developed" }

[features]
default = []
# Report image barriers whose layout had to be widened to accommodate several
# accesses at once - legal, but potentially slower than the caller intended.
log = ["dep:log"]

[dependencies]
ash = "0.38.0"
smallvec = "1.13"
log = { version = "0.4", optional = true }

